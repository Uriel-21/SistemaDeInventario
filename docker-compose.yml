version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: SistemaInventarios
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - InventarioNetwork

    web:
        image: nginx:alpine
        container_name: app_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - InventarioNetwork

    db:
        image: mariadb:10.11
        container_name: inventario-db
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - InventarioNetwork

    node:
        image: node:20-alpine
        container_name: app-node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "5173:5173"
        tty: true
        networks:
            - InventarioNetwork

networks:
    InventarioNetwork:
        driver: bridge

volumes:
    db-data:
